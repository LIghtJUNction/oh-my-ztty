name: Bump version
on:
  workflow_dispatch:
    inputs:
      part:
        type: choice
        description: Semantic version component
        options: [patch, minor, major]
        default: patch
        required: true
permissions:
  contents: write
  actions: write
jobs:
  bump:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          submodules: recursive
      - run: sudo apt-get update && sudo apt-get install -y zsh
      - name: Bump, validate and publish tag
        env:
          PART: ${{ inputs.part }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          python3 scripts/bump.py "$PART" --release
      - name: Dispatch official build for the new tag
        run: gh workflow run release.yml --ref main -f "tag=v$(cat VERSION)"

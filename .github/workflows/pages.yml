name: Publish website
on:
  push:
    branches: [main]
    paths: ['site/**', 'scripts/build_site.py', 'VERSION', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned documentation renderer
        run: |
          python3 -m venv .cache/docs-venv
          .cache/docs-venv/bin/python -m pip install --disable-pip-version-check --require-hashes -r site/requirements.txt
      - name: Build static documentation and check local links
        run: .cache/docs-venv/bin/python scripts/build_site.py
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Wait until uploaded artifact is visible to the Pages API
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          for attempt in $(seq 1 15); do
            count=$(gh api "repos/$REPOSITORY/actions/runs/$RUN_ID/artifacts" --jq '[.artifacts[] | select(.name == "github-pages" and .expired == false)] | length')
            if [ "$count" -eq 1 ]; then exit 0; fi
            sleep 2
          done
          echo "Pages artifact is not visible after upload." >&2
          exit 1
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5

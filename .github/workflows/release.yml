name: Release
on:
  push:
    tags: ["v[0-9]*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
      # Keep final outputs and Cargo 1.100 intermediate artifacts in explicit cache roots.
      CARGO_TARGET_DIR: ${{ github.workspace }}/.cache/cargo-target/${{ matrix.arch }}
      CARGO_BUILD_BUILD_DIR: ${{ github.workspace }}/.cache/cargo-build/${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - name: Match immutable tag to suite version
        id: release_source
        run: |
          test "$RELEASE_TAG" = "v$(cat VERSION)"
          printf 'commit=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Install build and shell prerequisites
        id: rust_toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config zsh xvfb xdotool imagemagick fonts-dejavu-core \
            libx11-dev libxft-dev libxrender-dev libfontconfig1-dev \
            libwayland-dev libwayland-bin wayland-protocols libxkbcommon-dev libfreetype-dev libharfbuzz-dev \
            libegl1-mesa-dev libgles2-mesa-dev libgcc-s1
          rustup toolchain install 1.100.0 --profile minimal
          rustup default 1.100.0
          rustc -Vv > "$RUNNER_TEMP/oh-my-ztty-rustc.txt"
          printf 'fingerprint=%s\n' "$(sha256sum "$RUNNER_TEMP/oh-my-ztty-rustc.txt" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          printf 'cargo_home=%s\n' "${CARGO_HOME:-$HOME/.cargo}" >> "$GITHUB_OUTPUT"
      - name: Restore Cargo downloads and compiled artifacts
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        continue-on-error: true
        with:
          # Cache only public dependency downloads and disposable compiler output.
          path: |
            ${{ steps.rust_toolchain.outputs.cargo_home }}/registry/cache
            ${{ steps.rust_toolchain.outputs.cargo_home }}/registry/index
            ${{ steps.rust_toolchain.outputs.cargo_home }}/registry/src
            ${{ steps.rust_toolchain.outputs.cargo_home }}/git/db
            ${{ steps.rust_toolchain.outputs.cargo_home }}/git/checkouts
            ${{ env.CARGO_TARGET_DIR }}
            ${{ env.CARGO_BUILD_BUILD_DIR }}
          key: oh-my-ztty-release-v1-${{ matrix.runner }}-${{ runner.os }}-${{ runner.arch }}-${{ matrix.arch }}-rust-1.100.0-${{ steps.rust_toolchain.outputs.fingerprint }}-${{ hashFiles('dependencies.lock.json', 'components/**/Cargo.lock', 'components/**/Cargo.toml') }}-${{ steps.release_source.outputs.commit }}
          # Cargo must revalidate restored fingerprints; every check below still runs.
          restore-keys: |
            oh-my-ztty-release-v1-${{ matrix.runner }}-${{ runner.os }}-${{ runner.arch }}-${{ matrix.arch }}-rust-1.100.0-${{ steps.rust_toolchain.outputs.fingerprint }}-${{ hashFiles('dependencies.lock.json', 'components/**/Cargo.lock', 'components/**/Cargo.toml') }}-
            oh-my-ztty-release-v1-${{ matrix.runner }}-${{ runner.os }}-${{ runner.arch }}-${{ matrix.arch }}-rust-1.100.0-${{ steps.rust_toolchain.outputs.fingerprint }}-
      - name: Check installer lifecycle
        run: make check
      - name: Build complete source-locked bundle
        run: python3 scripts/build_bundle.py --arch "${{ matrix.arch }}"
      - name: Smoke actual bundled programs in isolated HOME
        run: python3 scripts/smoke_bundle.py dist/oh-my-ztty-*-linux-${{ matrix.arch }}.tar.gz
      - name: Check actual terminal window, keyboard, completion and cleanup
        run: python3 scripts/verify_graphical.py dist/oh-my-ztty-*-linux-${{ matrix.arch }}.tar.gz --output dist/evidence-${{ matrix.arch }} --samples 10
      - uses: actions/upload-artifact@v7
        with:
          name: bundle-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
  publish:
    needs: bundle
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: bundle-*
          path: dist
          merge-multiple: true
      - name: Prepare bootstrap installer checksum
        run: |
          cp install.sh dist/install.sh
          cd dist
          sha256sum install.sh > install.sh.sha256
      - name: Publish complete release
        run: python3 scripts/publish_release.py --tag "$RELEASE_TAG"
      - name: Publish the current website
        run: gh workflow run pages.yml --ref main

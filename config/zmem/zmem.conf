# zmem: the default oh-my-ztty system memory policy.
# Copied to /etc/zmem/zmem.conf on first setup; existing local edits are kept.
# Values ending in _mib use MiB. reserve_mib = 0 chooses a RAM-scaled reserve.
interval_ms = 2000
swap_chunk_mib = 2048
max_disk_swap_mib = 32768
disk_reserve_mib = 8192
swap_free_target_mib = 4096
reserve_mib = 0
zram_percent = 50
zram_enabled = true
protect_sessions = true
manage_swappiness = true
profile = balanced
swap_dir = /var/lib/zmem/swap
